services:
  - type: web
    name: jarvis-ai-assistant
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python cloud_deployment/main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_API_KEY
        sync: false
      - key: JARVIS_AUTH_TOKEN
        sync: false
