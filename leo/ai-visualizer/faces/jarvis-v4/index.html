<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JARVIS V4 — Holographic Operating Interface</title>
  <link rel="stylesheet" href="css/jarvis.css">
</head>
<body>
  <!-- 3D WebGL Canvas Layer -->
  <div id="viewport-container">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <!-- Cinematic Scanlines & Vignette -->
  <div class="cinematic-overlay"></div>
  <div class="scanlines"></div>

  <!-- 2D High-Tech HUD Layer -->
  <div class="hud-layer">
    <!-- 4 Alignment Corner Brackets -->
    <div class="bracket top-left"></div>
    <div class="bracket top-right"></div>
    <div class="bracket bottom-left"></div>
    <div class="bracket bottom-right"></div>

    <div class="crosshair tl"></div>
    <div class="crosshair tr"></div>
    <div class="crosshair bl"></div>
    <div class="crosshair br"></div>

    <!-- HUD Header -->
    <header class="hud-header">
      <div class="header-left">
        <div class="agent-title-row">
          <span class="agent-name" id="hud-agent-name">LEO</span>
          <span class="system-tag">V4.2 HOLOGRAPHIC BUS</span>
        </div>
        <div class="status-row">
          <span class="status-indicator"></span>
          <span id="hud-status-text">SYSTEM ONLINE // STANDBY</span>
        </div>
      </div>

      <div class="header-center">
        <div class="top-line-bar"></div>
        <div class="top-telemetry-text" id="hud-clock">00:00:00.00 T-SYS</div>
      </div>

      <div class="header-right">
        <div class="gauge-block">
          <div class="gauge-label">PROC <span id="hud-cpu-val">34%</span></div>
          <div class="gauge-bar-wrap">
            <div class="gauge-fill" id="hud-cpu-bar" style="width: 34%;"></div>
          </div>
        </div>
        <div class="gauge-block">
          <div class="gauge-label">MEM <span id="hud-mem-val">48%</span></div>
          <div class="gauge-bar-wrap">
            <div class="gauge-fill" id="hud-mem-bar" style="width: 48%;"></div>
          </div>
        </div>
        <div class="gauge-block">
          <div class="gauge-label">LINK</div>
          <div style="color: var(--jarvis-orange); font-size: 9px;" id="hud-link-val">LOCAL BUS</div>
        </div>
      </div>
    </header>

    <!-- HUD Footer -->
    <footer class="hud-footer">
      <div class="footer-left">
        <div class="state-badge" id="hud-state-badge">IDLE</div>
        <div class="telemetry-metrics">
          <div class="metric-line">FREQ <b>432.08 MHz</b></div>
          <div class="metric-line">FIELD <b>STABLE [1.02 G]</b></div>
        </div>
      </div>

      <div class="footer-center">
        <div class="subtitle-container" id="hud-subtitle"></div>
        <canvas id="waveform-canvas"></canvas>
      </div>

      <div class="footer-right">
        <!-- SVG Rotating Gyroscope Dial Widget -->
        <div class="gyro-widget">
          <svg class="gyro-svg" viewBox="0 0 100 100">
            <!-- Outer Dial Ring with notches -->
            <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,122,0,0.3)" stroke-width="1"/>
            <circle cx="50" cy="50" r="45" fill="none" stroke="var(--jarvis-orange)" stroke-width="2" stroke-dasharray="8 14" class="gyro-ring-outer"/>
            <!-- Inner Ring -->
            <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(255,122,0,0.4)" stroke-width="1"/>
            <circle cx="50" cy="50" r="32" fill="none" stroke="var(--jarvis-orange)" stroke-width="1.5" stroke-dasharray="16 28" class="gyro-ring-inner"/>
            <!-- Center Crosshair Reticle -->
            <line x1="50" y1="20" x2="50" y2="80" stroke="rgba(255,122,0,0.5)" stroke-width="0.8"/>
            <line x1="20" y1="50" x2="80" y2="50" stroke="rgba(255,122,0,0.5)" stroke-width="0.8"/>
            <circle cx="50" cy="50" r="4" fill="none" stroke="var(--jarvis-orange)" stroke-width="1.2"/>
            <circle cx="50" cy="50" r="1.5" fill="var(--jarvis-orange)"/>
          </svg>
        </div>
        <div style="font-size: 9px; letter-spacing: 0.15em; color: rgba(255, 180, 100, 0.6);">GYRO-STAB // N.38</div>
      </div>
    </footer>
  </div>

  <!-- Inline GLSL Shader Fallbacks for Direct / Offline File Viewing -->
  <script type="x-shader/x-vertex" id="fallback-sphere-vert">
    uniform float uTime;
    uniform float uAudioLevel;
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec3 vViewPosition;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      vPosition = position;
      float displacement = sin(position.x * 4.0 + uTime * 2.0) 
                         * cos(position.y * 4.0 + uTime * 2.0) 
                         * (0.02 + uAudioLevel * 0.08);
      vec3 newPosition = position + normal * displacement;
      vec4 mvPosition = modelViewMatrix * vec4(newPosition, 1.0);
      vViewPosition = -mvPosition.xyz;
      gl_Position = projectionMatrix * mvPosition;
    }
  </script>

  <script type="x-shader/x-fragment" id="fallback-sphere-frag">
    uniform vec3 uColor;
    uniform float uTime;
    uniform float uAudioLevel;
    uniform float uOpacity;
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec3 vViewPosition;
    varying vec2 vUv;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }
    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), f.x),
                 mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
    }
    void main() {
      vec3 viewDir = normalize(vViewPosition);
      vec3 normal = normalize(vNormal);
      float fresnel = pow(1.0 - max(0.0, dot(viewDir, normal)), 2.5);
      float lat = fract(vUv.y * 32.0);
      float lon = fract(vUv.x * 64.0);
      float grid = step(0.92, lat) * 0.8 + step(0.94, lon) * 0.8;
      float scan = sin(vPosition.y * 5.0 - uTime * 3.0);
      scan = smoothstep(0.85, 1.0, scan);
      float n = noise(vUv * 16.0 + vec2(uTime * 0.05, 0.0));
      float digitalMask = step(0.42, n);
      float intensity = (fresnel * 1.8 + grid * 0.9 + scan * 1.5 + 0.15) * digitalMask;
      intensity += fresnel * 0.6;
      intensity *= (1.0 + uAudioLevel * 2.0);
      vec3 finalColor = uColor * intensity;
      vec3 hotGlow = mix(uColor, vec3(1.0, 0.95, 0.8), fresnel * 0.7);
      gl_FragColor = vec4(mix(finalColor, hotGlow, fresnel * 0.5), clamp(intensity * uOpacity, 0.0, 1.0));
    }
  </script>

  <script type="x-shader/x-vertex" id="fallback-particle-vert">
    attribute float aSize;
    attribute float aSpeed;
    attribute float aPhase;
    uniform float uTime;
    uniform float uAudioLevel;
    uniform float uPixelRatio;
    varying float vAlpha;
    void main() {
      float angle = uTime * aSpeed * 0.25 + aPhase;
      float cosA = cos(angle);
      float sinA = sin(angle);
      vec3 pos = position;
      float rx = pos.x * cosA - pos.z * sinA;
      float rz = pos.x * sinA + pos.z * cosA;
      pos.x = rx;
      pos.z = rz;
      float pulse = 1.0 + (sin(uTime * 3.0 + aPhase) * 0.05) + (uAudioLevel * 0.28);
      pos *= pulse;
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      float dist = max(1.0, -mvPosition.z);
      gl_PointSize = (aSize * (1.0 + uAudioLevel * 1.6) * uPixelRatio) * (220.0 / dist);
      vAlpha = clamp(0.3 + 0.7 * sin(uTime * 2.0 + aPhase) + uAudioLevel * 0.6, 0.15, 1.0);
    }
  </script>

  <script type="x-shader/x-fragment" id="fallback-particle-frag">
    uniform vec3 uColor;
    uniform float uOpacity;
    varying float vAlpha;
    void main() {
      vec2 coord = gl_PointCoord - vec2(0.5);
      float dist = length(coord);
      if (dist > 0.5) discard;
      float glow = 1.0 - smoothstep(0.0, 0.5, dist);
      glow = pow(glow, 1.8);
      vec3 hotCenter = mix(uColor, vec3(1.0, 1.0, 0.9), glow * 0.6);
      gl_FragColor = vec4(hotCenter, glow * vAlpha * uOpacity);
    }
  </script>

  <!-- ai-visualizer Core Signal Bus -->
  <script src="../../core.js"></script>

  <!-- Three.js 3D Library -->
  <script src="js/vendor/three.min.js"></script>
  <script>
    if (typeof THREE === "undefined") {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>

  <!-- JARVIS V4 Modular Engine -->
  <script src="js/themes.js"></script>
  <script src="js/state.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/core.js"></script>
  <script src="js/rings.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/sphere.js"></script>
  <script src="js/arcs.js"></script>
  <script src="js/waveform.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/websocket.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
